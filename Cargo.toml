[workspace]
members = [
    "rust/limpid-agent-core",
    "rust/limpid-agent-protocol",
    "rust/limpid-rust-bridge",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
