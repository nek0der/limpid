[package]
name = "limpid-rust-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
limpid-agent-core = { path = "../limpid-agent-core" }
limpid-agent-hook = { path = "../limpid-agent-hook" }
limpid-agent-model = { path = "../limpid-agent-model" }
limpid-agent-protocol = { path = "../limpid-agent-protocol" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

# cbindgen (MPL-2.0) regenerates include/limpid_rust_bridge.h on every build so
# the committed header can never drift from the exported symbols. The default
# features only serve its command-line binary; leaving them out keeps clap and
# its dependencies out of every Xcode build.
[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[lints]
workspace = true
