# Mirrors the shape of the former hand-written header: one include guard,
# stddef/stdint only, C99 comments, and no cbindgen name prefixes.
language = "C"
include_guard = "LIMPID_RUST_BRIDGE_H"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from limpid-rust-bridge. Do not edit; run `make rust-header`. */"
documentation = true
documentation_style = "c99"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
style = "both"
usize_is_size_t = true

[export]
prefix = ""
# cbindgen only emits types reachable from exported functions. The status enums
# are returned as plain int32_t, so they must be listed here to stay in the
# header; add any future status enum to this list as well.
include = ["limpid_approval_result", "limpid_title_resolve_result"]

[enum]
prefix_with_name = false

[fn]
sort_by = "None"
