name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Weekly: Mondays at 06:00 UTC

# We analyze the Rust workspace, not the Swift app. Rust needs no build
# (`build-mode: none`), so it is cheap enough to run on every pull request.
# Swift needs a traced build: it took over an hour on macOS for this app,
# and CodeQL cannot trace a build under Xcode 27 or analyze Swift 6.4.

permissions:
  actions: read
  contents: read
  security-events: write

# A newer push to a pull request replaces its analysis, but every commit on
# `main` keeps its own, so the alert history has no gaps.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
