name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Weekly: Mondays at 06:00 UTC
  # We deliberately don't run on `pull_request`. The Swift analyzer
  # needs a full build (Zig + libghostty + xcodebuild), which costs
  # 15-30 minutes per PR — disproportionate for a single-maintainer
  # OSS where security alerts are reviewed in batch off the main
  # branch anyway. Post-merge + weekly is enough coverage.

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          XCODE=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tooling
        run: brew install xcodegen zig@0.16

      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain

      # The cache key names the vendor/ghostty commit the superproject pins.
      # Hashing build files and .gitmodules missed a bump that changed only
      # Ghostty's sources, and a hit then linked the previous library.
      - name: Resolve libghostty source commit
        id: ghostty-src
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD:vendor/ghostty)
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore GhosttyKit.xcframework cache
        id: cache-ghostty
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          key: ghostty-v2-${{ runner.os }}-${{ steps.ghostty-src.outputs.sha }}-${{ hashFiles('scripts/build-ghostty.sh') }}

      - name: Build libghostty xcframework
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: ./scripts/build-ghostty.sh

      - name: Save GhosttyKit.xcframework cache
        if: always() && steps.cache-ghostty.outputs.cache-hit != 'true' && hashFiles('vendor/ghostty/macos/GhosttyKit.xcframework/**') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          key: ${{ steps.cache-ghostty.outputs.cache-primary-key }}

      - name: Generate Xcode project
        run: xcodegen generate

      # Initialize CodeQL AFTER libghostty + xcodegen so the Swift
      # tracer only wraps the Limpid build below. When init ran before
      # libghostty, CodeQL's compiler wrappers intercepted Zig's
      # invocation of `metal` for Ghostty's shaders and the shader
      # compile failed. We don't need to analyze vendor/ghostty
      # (it's Zig, not Swift), so tracing only the final xcodebuild
      # is both correct and avoids the conflict.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: swift

      - name: Build for CodeQL
        run: |
          # `generic/platform=macOS` (Any Mac), not `platform=macOS`.
          # CodeQL's Swift tracer wraps xcodebuild in an x86_64 process, so a
          # device-specific destination resolves the runner as x86_64 and can't
          # match our arm64-only scheme — destination resolution fails before
          # compilation. A generic destination is arch-agnostic and builds arm64.
          xcodebuild \
            -project Limpid.xcodeproj \
            -scheme Limpid \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
