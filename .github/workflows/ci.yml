name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Check formatting
        run: cargo fmt --all --check
      # The bridge build script rewrites the committed header; any diff means
      # the header in git no longer matches the exported Rust items. The
      # Windows runner compares cleanly because .gitattributes pins LF endings.
      - name: Check generated header
        run: |
          cargo build --locked --package limpid-rust-bridge
          git diff --exit-code -- rust/limpid-rust-bridge/include/limpid_rust_bridge.h
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace --all-targets

  build:
    name: Build (macOS 26)
    needs: [format, lint]
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          XCODE=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tooling
        run: brew install xcodegen zig@0.16 tmux

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      # The cache key names the vendor/ghostty commit the superproject pins.
      # Hashing build files and .gitmodules missed a bump that changed only
      # Ghostty's sources, and a hit then linked the previous library.
      - name: Resolve libghostty source commit
        id: ghostty-src
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD:vendor/ghostty)
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore GhosttyKit.xcframework cache
        id: cache-ghostty
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          key: ghostty-v2-${{ runner.os }}-${{ steps.ghostty-src.outputs.sha }}-${{ hashFiles('scripts/build-ghostty.sh') }}

      - name: Build libghostty xcframework
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: ./scripts/build-ghostty.sh

      - name: Save GhosttyKit.xcframework cache
        if: always() && steps.cache-ghostty.outputs.cache-hit != 'true' && hashFiles('vendor/ghostty/macos/GhosttyKit.xcframework/**') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          key: ${{ steps.cache-ghostty.outputs.cache-primary-key }}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build and test with coverage
        env:
          LIMPID_REQUIRE_TMUX_TESTS: "1"
        run: |
          set -o pipefail
          xcodebuild \
            -project Limpid.xcodeproj \
            -scheme Limpid \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Limpid.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test | xcbeautify --renderer github-actions

      - name: Validate development service bundle
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug/Limpid Dev.app"
          SERVICE_PATH="$APP_PATH/Contents/MacOS/AgentIntegrationService"
          SERVICE_PLIST="$APP_PATH/Contents/Library/LaunchAgents/dev.limpid.agent-integration-service.dev.plist"
          test -x "$SERVICE_PATH"
          test -f "$SERVICE_PLIST"
          test ! -e "$APP_PATH/Contents/Library/LaunchAgents/dev.limpid.agent-integration-service.plist"
          plutil -lint "$SERVICE_PLIST"

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Limpid.xcresult
          path: build/Limpid.xcresult
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage report"
            echo '```'
            xcrun xccov view --report --only-targets build/Limpid.xcresult || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The release workflow is the only other place that archives, and it runs
  # after the tag exists; v0.1.5 failed there on an archive Xcode classed as
  # generic. Archiving unsigned here catches that class of failure on the PR
  # and compiles the Release side of the `#if DEBUG` branches the Debug test
  # build skips. Signing and notarization still need the certificate and stay in
  # release.yml.
  release-archive:
    name: Release archive (macOS 26)
    needs: [format, lint]
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          XCODE=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tooling
        run: brew install xcodegen zig@0.16

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      # The cache key names the vendor/ghostty commit the superproject pins.
      # Hashing build files and .gitmodules missed a bump that changed only
      # Ghostty's sources, and a hit then linked the previous library.
      - name: Resolve libghostty source commit
        id: ghostty-src
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD:vendor/ghostty)
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore GhosttyKit.xcframework cache
        id: cache-ghostty
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          key: ghostty-v2-${{ runner.os }}-${{ steps.ghostty-src.outputs.sha }}-${{ hashFiles('scripts/build-ghostty.sh') }}

      - name: Build libghostty xcframework
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: ./scripts/build-ghostty.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive Release unsigned and check it can be distributed
        run: make release-check

      # The guardrail job has no build, so the notices check proves what the
      # app links only here, from the archive and its dSYM. It must not skip.
      - name: Check the archive against THIRD-PARTY-NOTICES
        run: LIMPID_NOTICES_REQUIRE_BINARY=1 scripts/check-notices-coverage.sh

  format:
    name: SwiftFormat
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Mint
        run: brew install mint
      # Mint builds SwiftFormat from source, and the build jobs wait for this
      # job. The build is kept between runs, keyed by Mintfile, so a new
      # version builds once.
      - name: Restore Mint package cache
        id: cache-mint
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.mint
          key: mint-v1-${{ runner.os }}-${{ hashFiles('Mintfile') }}
      - name: Install SwiftFormat (pinned via Mintfile)
        run: mint bootstrap
      - name: Save Mint package cache
        if: steps.cache-mint.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.mint
          key: ${{ steps.cache-mint.outputs.cache-primary-key }}
      - name: Run SwiftFormat (lint mode, gating)
        run: mint run swiftformat --lint .

  review-core:
    name: Review core scenarios
    needs: [format, lint]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select latest Xcode
        run: |
          set -euo pipefail
          XCODE=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      # No Xcode project and no libghostty: this compiles the terminal probe on
      # its own so the one review scenario the parallel test target cannot host
      # still runs somewhere. The probe brings its own pty through `script`, so
      # it does not need the runner to have a terminal.
      - name: Run the terminal probe scenario
        run: scripts/validate-review-core.sh

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install SwiftLint
        run: brew install swiftlint
      # `--strict` matches `make lint`, so a warning fails CI the same way
      # it fails locally, and CI never passes a tree that `make lint` rejects.
      - name: Run SwiftLint
        run: swiftlint lint --strict --quiet
      - name: Check Japanese translations
        run: scripts/check-localization.sh
      - name: Self-test the translation check (plurals and substitutions included)
        run: scripts/test-check-localization.sh
      - name: Self-test the fixture golden script against the adapters' rules
        run: scripts/test-derive-expected-events.sh
      - name: Self-test that make screenshot shoots the app this checkout built
        run: scripts/test-screenshot-app.sh
