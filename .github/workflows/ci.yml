name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release pull request skips the builds, tests, and Swift lint below. It
  # changes only version numbers and the changelog on top of code `main` already
  # checked, and every merge to `main` updates it, so its runs kept other pull
  # requests waiting for a runner. Dispatching this workflow on its branch runs
  # everything. GitHub shows those results only in the Actions tab: they do not
  # appear among the pull request's checks or count as its required checks.
  workflow_dispatch:

permissions:
  contents: read

# A pull request only needs its latest push checked, so a new push cancels the
# run before it. Every commit on `main` gets a run of its own: canceling would
# leave a commit unchecked and its build unsaved for pull requests, and sharing
# a group with `cancel-in-progress: false` would still drop a waiting run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Actions has no fail-fast across the jobs of a run, and `needs` would put the
  # shortest jobs in front of the longest. So a pull request's run watches itself
  # and stops at its first failure, which frees the macOS runners for other runs.
  # `main` is left out: the run for each of its commits has to finish and save
  # its build. A fork is left out too: its read-only token cannot cancel a run.
  # This is its own job because canceling takes `actions: write`, which the jobs
  # running a pull request's code should not hold. A run that goes on only costs
  # time, so a failure here does not fail the run. The job polls every 30 seconds
  # because all of this repository's runs share the token's limit of 1,000
  # requests an hour. The release pull request is left out: it has little to
  # stop, and this would poll for as long as `main-ci-passed` waits.
  stop-on-failure:
    name: Stop the run on a failure
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Cancel the run when a job fails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            # A failed read says nothing about the jobs, so the loop waits for the next one.
            if states=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name != "Stop the run on a failure") | .conclusion // "running"'); then
              if grep -qE '^(failure|timed_out)$' <<<"$states"; then
                gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
                exit
              fi
              # An empty list means the other jobs are not listed yet, not that they finished.
              [ -z "$states" ] || grep -q '^running$' <<<"$states" || exit 0
            fi
            sleep 30
          done

  # Merging the release pull request creates the tag, and with its builds skipped
  # nothing else stops that merge while `main` is red or still running. So this
  # waits for the run on the newest commit of `main` and takes its result. It
  # waits rather than failing early because nothing would start it again when
  # that run ends. After a failed run on `main` is re-run and passes, this job
  # needs a re-run too; a new commit on `main` updates the pull request and
  # starts it anyway. That holds for every commit because of `always-update` in
  # the release-please config: by default, one that leaves the pull request's
  # text the same, such as a hidden `chore`, does not update it.
  main-ci-passed:
    name: Main CI passed
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the run on the newest commit of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            # A failed read says nothing about the run, so the loop waits for the next one.
            if sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) &&
              result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=1" \
                --jq '.workflow_runs[0] | .status + " " + (.conclusion // "")'); then
              case "$result" in
                "completed success") exit 0 ;;
                completed*)
                  echo "::error::The CI run on main ($sha) ended as: ${result#completed }"
                  exit 1
                  ;;
              esac
            fi
            sleep 60
          done

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # This lets every OS finish on `main`. On a pull request, `stop-on-failure`
    # stops the run at the first failure anyway.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]

    # The release pull request skips the steps here, not the job: a skipped
    # matrix job reports under its unexpanded name, and the required checks
    # for each OS would then wait forever.
    env:
      IS_RELEASE_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--') }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.IS_RELEASE_PR != 'true'
      - name: Install pinned Rust toolchain
        if: env.IS_RELEASE_PR != 'true'
        run: rustup toolchain install --no-self-update
      - name: Check formatting
        if: env.IS_RELEASE_PR != 'true'
        run: cargo fmt --all --check
      # The bridge build script rewrites the committed header; any diff means
      # the header in git no longer matches the exported Rust items. The
      # Windows runner compares cleanly because .gitattributes pins LF endings.
      - name: Check generated header
        if: env.IS_RELEASE_PR != 'true'
        run: |
          cargo build --locked --package weir-rust-bridge
          git diff --exit-code -- rust/weir-rust-bridge/include/weir_rust_bridge.h
      - name: Run Clippy
        if: env.IS_RELEASE_PR != 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run tests
        if: env.IS_RELEASE_PR != 'true'
        run: cargo test --locked --workspace --all-targets

  # The two build jobs do not wait for SwiftFormat and SwiftLint: those take
  # under a minute, and waiting put that minute in front of the longest job.
  # A lint failure still fails the run, and on a pull request it stops these
  # jobs through `stop-on-failure`. Review core still waits, so no more
  # than five macOS jobs start at once, the limit for this account's plan.
  # A sixth would wait for a free runner, and the one left waiting could be
  # this one.
  build:
    name: Build (macOS 26)
    if: github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-please--')
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Select latest Xcode
        id: xcode
        run: |
          set -euo pipefail
          XCODE=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          printf 'build=%s\n' "$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"

      - name: Install tooling
        run: brew install xcodegen tmux xcbeautify

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      # The cache key names the vendor/ghostty commit the superproject pins.
      # Hashing build files and .gitmodules missed a bump that changed only
      # Ghostty's sources, and a hit then linked the previous library.
      - name: Resolve libghostty source commit
        id: ghostty-src
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD:vendor/ghostty)
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore GhosttyKit.xcframework cache
        id: cache-ghostty
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          key: ghostty-v2-${{ runner.os }}-${{ steps.ghostty-src.outputs.sha }}-${{ hashFiles('scripts/build-ghostty.sh') }}

      # Zig builds libghostty and nothing else, so it is installed only when
      # the cached xcframework is missing.
      - name: Install Zig
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: brew install zig@0.17

      - name: Build libghostty xcframework
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: ./scripts/build-ghostty.sh

      # Not on a canceled run: a build stopped partway would be saved under the
      # key of a complete one, and every later run would hit it.
      - name: Save GhosttyKit.xcframework cache
        if: ${{ !cancelled() && steps.cache-ghostty.outputs.cache-hit != 'true' && hashFiles('vendor/ghostty/macos/GhosttyKit.xcframework/**') != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          key: ${{ steps.cache-ghostty.outputs.cache-primary-key }}

      - name: Generate Xcode project
        run: xcodegen generate

      # `scripts/build-rust-bridge.sh` builds into `cargo-target` under
      # OBJROOT, and Xcode resolves Sparkle into SourcePackages: neither is on
      # a new runner. A restore from an older key still spares
      # building the crates and fetching the package that did not change.
      # `project.yml` stays out of the key: release-please changes its version
      # on every release, and Xcode checks the restored packages against
      # `project.yml` anyway.
      #
      # The key names the checkout path because SwiftPM records each package
      # artifact's absolute path in `workspace-state.json` and Xcode looks
      # nowhere else. Renaming the repository moves the checkout, and a cache
      # from the old path then fails the build.
      - name: Restore Cargo and SwiftPM caches
        id: cache-deps
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            build/DerivedData/Build/Intermediates.noindex/cargo-target
            build/DerivedData/SourcePackages
          key: build-deps-v1-${{ runner.os }}-${{ github.workspace }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: build-deps-v1-${{ runner.os }}-${{ github.workspace }}-

      # A pull request builds on the last build of `main`, so it compiles what
      # it changed and what depends on that. Xcode judges a restored
      # DerivedData by file dates, which a fresh checkout resets, so the
      # sources take a date from their content first. Xcode's compilation
      # cache could not do this job: one changed file invalidates its whole
      # module.
      - name: Date the sources by their content
        run: scripts/stamp-source-times.sh

      # A restored build keeps its precompiled C modules even when a header
      # they came from changes, which fails the build or, worse, leaves an
      # unchanged Swift caller on the old signature. So the key names those
      # headers, and a pull request that changes one builds clean. It names the
      # checkout path too: a build records absolute paths throughout, so one
      # made at another path is not worth restoring.
      - name: Name the restored build
        id: build-key
        env:
          PREFIX: derived-data-v1-${{ runner.os }}-${{ github.workspace }}-${{ steps.xcode.outputs.build }}-${{ steps.ghostty-src.outputs.sha }}-${{ hashFiles('rust/weir-rust-bridge/include/**') }}
        run: printf 'prefix=%s\n' "$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Restore the last build of main
        id: cache-build
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/DerivedData/Build
          key: ${{ steps.build-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: ${{ steps.build-key.outputs.prefix }}-

      # Built and tested in two steps: xcodebuild prints the build timing
      # summary for `build-for-testing` but not for `test`.
      #
      # A restored build can still fail where a clean one would not, so a
      # failure on one gets one clean build before it counts. `main` always
      # builds clean, which keeps a stale result from carrying over and keeps
      # what a release ships from depending on an earlier build.
      - name: Build for testing with coverage
        env:
          RESTORED_KEY: ${{ steps.cache-build.outputs.cache-matched-key }}
        run: |
          set -o pipefail
          mkdir -p build
          build_for_testing() {
            xcodebuild \
              -project Weir.xcodeproj \
              -scheme Weir \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath build/DerivedData \
              -enableCodeCoverage YES \
              -showBuildTimingSummary \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build-for-testing | tee build/xcodebuild.log | xcbeautify --renderer github-actions
          }
          if ! build_for_testing; then
            [ -n "$RESTORED_KEY" ] || exit 1
            echo "::notice::The build on a restored DerivedData failed; building clean."
            rm -rf build/DerivedData/Build
            build_for_testing
          fi

      - name: Save this build for pull requests
        if: github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/DerivedData/Build
          key: ${{ steps.build-key.outputs.prefix }}-${{ github.sha }}

      # Not on a canceled run, for the same reason as the libghostty cache.
      - name: Save Cargo and SwiftPM caches
        if: ${{ !cancelled() && steps.cache-deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            build/DerivedData/Build/Intermediates.noindex/cargo-target
            build/DerivedData/SourcePackages
          key: ${{ steps.cache-deps.outputs.cache-primary-key }}

      # Read from the raw log, which keeps every line as xcodebuild wrote it,
      # and printed to the log as well as the job summary, which the API
      # cannot read.
      - name: Build timing summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Build timing"
            echo '```'
            sed -n '/Build Timing Summary/,/^\*\*/p' build/xcodebuild.log || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test with coverage
        env:
          WEIR_REQUIRE_TMUX_TESTS: "1"
        run: |
          set -o pipefail
          xcodebuild \
            -project Weir.xcodeproj \
            -scheme Weir \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Weir.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building | xcbeautify --renderer github-actions

      - name: Validate development service bundle
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug/Weir Dev.app"
          SERVICE_PATH="$APP_PATH/Contents/MacOS/AgentIntegrationService"
          SERVICE_PLIST="$APP_PATH/Contents/Library/LaunchAgents/com.nekoder.weir.agent-integration-service.dev.plist"
          test -x "$SERVICE_PATH"
          test -f "$SERVICE_PLIST"
          test ! -e "$APP_PATH/Contents/Library/LaunchAgents/com.nekoder.weir.agent-integration-service.plist"
          plutil -lint "$SERVICE_PLIST"

      - name: Upload xcresult bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Weir.xcresult
          path: build/Weir.xcresult
          retention-days: 14

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Coverage report"
            echo '```'
            xcrun xccov view --report --only-targets build/Weir.xcresult || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Each saved build is about the size of a build, and only the newest is ever
  # restored. Deleting the older ones keeps them from pushing out the other
  # caches at the repository's limit. This is its own job because deleting takes
  # `actions: write`, which the build job, running a pull request's code, should
  # not hold. A build left behind only costs cache space, so a failure here does
  # not fail the run.
  prune-build-cache:
    name: Prune saved builds
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Delete all but the newest saved build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key derived-data-v1- --sort created_at --order desc --limit 100 --json id \
            --jq '.[1:][].id' |
            while read -r id; do
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
            done

  # The release workflow is the only other place that archives, and it runs
  # after the tag exists; v0.1.5 failed there on an archive Xcode classed as
  # generic. Archiving unsigned here catches that class of failure on the PR
  # and compiles the Release side of the `#if DEBUG` branches the Debug test
  # build skips. Signing and notarization still need the certificate and stay in
  # release.yml.
  release-archive:
    name: Release archive (macOS 26)
    if: github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-please--')
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          XCODE=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tooling
        run: brew install xcodegen

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      # The cache key names the vendor/ghostty commit the superproject pins.
      # Hashing build files and .gitmodules missed a bump that changed only
      # Ghostty's sources, and a hit then linked the previous library.
      - name: Resolve libghostty source commit
        id: ghostty-src
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD:vendor/ghostty)
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore GhosttyKit.xcframework cache
        id: cache-ghostty
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          key: ghostty-v2-${{ runner.os }}-${{ steps.ghostty-src.outputs.sha }}-${{ hashFiles('scripts/build-ghostty.sh') }}

      # Zig builds libghostty and nothing else, so it is installed only when
      # the cached xcframework is missing.
      - name: Install Zig
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: brew install zig@0.17

      - name: Build libghostty xcframework
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: ./scripts/build-ghostty.sh

      - name: Generate Xcode project
        run: xcodegen generate

      # Whole-module optimization is most of this job's time, and one changed
      # file means redoing all of it, so a cache cannot help. A pull request
      # skips it: the archive's layout and the `#if DEBUG` branches do not
      # depend on the optimizer. `main` and a dispatched run still optimize as
      # a release does. Merging the release pull request is what creates the
      # tag, and `main-ci-passed` holds that merge until `main` has passed, so
      # a failure only the optimizer hits shows up before the tag exists.
      - name: Archive Release unsigned and check it can be distributed
        env:
          RELEASE_CHECK_BUILD_SETTINGS: ${{ github.event_name == 'pull_request' && 'SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=singlefile' || '' }}
        run: make release-check

      # The guardrail job has no build, so the notices check proves what the
      # app links only here, from the archive and its dSYM. It must not skip.
      - name: Check the archive against THIRD-PARTY-NOTICES
        run: WEIR_NOTICES_REQUIRE_BINARY=1 scripts/check-notices-coverage.sh

  format:
    name: SwiftFormat
    if: github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-please--')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Mint
        run: brew install mint
      # Mint builds SwiftFormat from source, and the build jobs wait for this
      # job. The build is kept between runs, keyed by Mintfile, so a new
      # version builds once.
      - name: Restore Mint package cache
        id: cache-mint
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.mint
          key: mint-v1-${{ runner.os }}-${{ hashFiles('Mintfile') }}
      - name: Install SwiftFormat (pinned via Mintfile)
        run: mint bootstrap
      - name: Save Mint package cache
        if: steps.cache-mint.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.mint
          key: ${{ steps.cache-mint.outputs.cache-primary-key }}
      - name: Run SwiftFormat (lint mode, gating)
        run: mint run swiftformat --lint .

  review-core:
    name: Review core scenarios
    needs: [format, lint]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select latest Xcode
        run: |
          set -euo pipefail
          XCODE=$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      # No Xcode project and no libghostty: this compiles the terminal probe on
      # its own so the one review scenario the parallel test target cannot host
      # still runs somewhere. The probe brings its own pty through `script`, so
      # it does not need the runner to have a terminal.
      - name: Run the terminal probe scenario
        run: scripts/validate-review-core.sh

  lint:
    name: SwiftLint
    if: github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'release-please--')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install SwiftLint
        run: brew install swiftlint
      # `--strict` matches `make lint`, so a warning fails CI the same way
      # it fails locally, and CI never passes a tree that `make lint` rejects.
      - name: Run SwiftLint
        run: swiftlint lint --strict --quiet
      - name: Check Japanese translations
        run: scripts/check-localization.sh
      - name: Self-test the translation check (plurals and substitutions included)
        run: scripts/test-check-localization.sh
      - name: Self-test the check of strings in a static module
        run: scripts/test-check-module-strings.sh
      - name: Self-test the fixture golden script against the adapters' rules
        run: scripts/test-derive-expected-events.sh
      - name: Self-test that make screenshot shoots the app this checkout built
        run: scripts/test-screenshot-app.sh
