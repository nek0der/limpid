name: Limpid
options:
  bundleIdPrefix: dev.limpid
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  # Default UI language. `Localizable.xcstrings` holds en (source) +
  # ja translations; system locale falls back to en when not ja.
  developmentLanguage: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    # String Catalog auto-extraction + type-safe symbol generation
    # (Xcode 26). Every Text("…") literal lands in the catalog at
    # build time; access via the generated `String.Localizable.…`
    # symbols (or directly by the source string).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Default version stamps for local dev builds. CI overrides both
    # at archive time via xcodebuild MARKETING_VERSION=... and
    # CURRENT_PROJECT_VERSION=... so the released app reports the
    # actual tag (release-please bumps these in lockstep with tags).
    MARKETING_VERSION: "0.1.4" # x-release-please-version
    CURRENT_PROJECT_VERSION: "0.1.4" # x-release-please-version
    # Debug uses ad-hoc signing for fast local iteration.
    # Release is signed with the Developer ID Application certificate
    # so the distributable .app can be notarized.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    GENERATE_INFOPLIST_FILE: YES
    # Any target importing Limpid's Swift module must also resolve the Clang
    # module recorded by the Rust bridge wrapper, including LimpidTests.
    SWIFT_INCLUDE_PATHS:
      - $(inherited)
      - $(SRCROOT)/rust/limpid-rust-bridge/include
    OTHER_LDFLAGS:
      - -framework Carbon
      - -framework Metal
      - -framework MetalKit
      - -framework QuartzCore
      - -framework CoreGraphics
      - -framework Foundation
      - -framework IOKit
      - -framework CoreText
      - -lz
      - -lc++
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 44V4P6L9PM
      OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime"
      # Xcode injects com.apple.security.get-task-allow into entitlements
      # by default, which fails Apple notarization. Disable injection so
      # the Release executable is not flagged as debuggable.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  AgentIntegrationService:
    type: tool
    platform: macOS
    sources:
      - path: AgentIntegrationService/Service
      - path: AgentIntegrationService/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.AgentIntegrationService
        PRODUCT_NAME: AgentIntegrationService
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(DERIVED_FILE_DIR)/limpid-rust
        OTHER_LDFLAGS:
          - $(inherited)
          - -llimpid_rust_bridge
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.AgentIntegrationService.dev
          OTHER_CODE_SIGN_FLAGS: "--identifier dev.limpid.AgentIntegrationService.dev"
        Release:
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime --identifier dev.limpid.AgentIntegrationService"
    dependencies:
      - sdk: Security.framework
    preBuildScripts:
      - name: Build Rust bridge
        script: '"$SRCROOT/scripts/build-rust-bridge.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Cargo.toml
          - $(SRCROOT)/Cargo.lock
          - $(SRCROOT)/rust-toolchain.toml
          - $(SRCROOT)/scripts/build-rust-bridge.sh
          - $(SRCROOT)/rust/limpid-agent-core/Cargo.toml
          - $(SRCROOT)/rust/limpid-agent-core/src/lib.rs
          - $(SRCROOT)/rust/limpid-agent-core/src/approval.rs
          - $(SRCROOT)/rust/limpid-agent-protocol/Cargo.toml
          - $(SRCROOT)/rust/limpid-agent-protocol/src/lib.rs
          - $(SRCROOT)/rust/limpid-agent-protocol/src/service.rs
          - $(SRCROOT)/rust/limpid-agent-protocol/src/wire.rs
          - $(SRCROOT)/rust/limpid-rust-bridge/Cargo.toml
          - $(SRCROOT)/rust/limpid-rust-bridge/src/lib.rs
        outputFiles:
          - $(DERIVED_FILE_DIR)/limpid-rust/liblimpid_rust_bridge.a

  AgentIntegrationRequesterProbe:
    type: tool
    platform: macOS
    sources:
      - path: AgentIntegrationService/RequesterProbe
      - path: AgentIntegrationService/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.AgentIntegrationRequesterProbe
        PRODUCT_NAME: AgentIntegrationRequesterProbe
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.AgentIntegrationRequesterProbe.dev
          OTHER_CODE_SIGN_FLAGS: "--identifier dev.limpid.AgentIntegrationRequesterProbe.dev"
        Release:
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime --identifier dev.limpid.AgentIntegrationRequesterProbe"
    dependencies:
      - sdk: Security.framework

  AgentIntegrationHookHelper:
    type: tool
    platform: macOS
    sources:
      - path: AgentIntegrationService/HookHelper
      - path: AgentIntegrationService/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.AgentIntegrationHookHelper
        PRODUCT_NAME: AgentIntegrationHookHelper
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.AgentIntegrationHookHelper.dev
          OTHER_CODE_SIGN_FLAGS: "--identifier dev.limpid.AgentIntegrationHookHelper.dev"
        Release:
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime --identifier dev.limpid.AgentIntegrationHookHelper"
    dependencies:
      - sdk: Security.framework

  AgentIntegrationControllerProbe:
    type: tool
    platform: macOS
    sources:
      - path: AgentIntegrationService/ControllerProbe
      - path: AgentIntegrationService/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.AgentIntegrationControllerProbe
        PRODUCT_NAME: AgentIntegrationControllerProbe
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.AgentIntegrationControllerProbe.dev
          OTHER_CODE_SIGN_FLAGS: "--identifier dev.limpid.AgentIntegrationControllerProbe.dev"
        Release:
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime --identifier dev.limpid.AgentIntegrationControllerProbe"
    dependencies:
      - sdk: Security.framework

  Limpid:
    type: application
    platform: macOS
    sources:
      - path: Limpid
        excludes:
          - "Resources/ghostty"
          - "Resources/terminfo"
          - "Resources/claude-shim"
          - "Resources/codex-shim"
          - "Resources/agent-shim"
      - path: AgentIntegrationService/Shared
      - path: AgentIntegrationService/Service/RustApprovalHost.swift
      - path: AgentIntegrationService/Resources/dev.limpid.agent-integration-service.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: AgentIntegrationService/Resources/dev.limpid.agent-integration-service.dev.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      # Bundle libghostty's shell-integration scripts + the themes
      # we ship as Limpid's defaults (Apple System Colors Light/Dark).
      # `type: folder` keeps the directory structure intact under
      # `.app/Contents/Resources/ghostty/`, which is where
      # `GhosttyApp.resolveResourcesDir()` looks first.
      - path: Limpid/Resources/ghostty
        type: folder
      # libghostty looks for this database beside its `ghostty` resources
      # directory and exports TERMINFO to every pty. Keep the compiled aliases
      # as a folder resource so ncurses' hexadecimal lookup directories survive.
      - path: Limpid/Resources/terminfo
        type: folder
      # Bundle the Claude Code shim + hook receiver. `type: folder`
      # preserves the executable bit so the scripts stay runnable
      # inside `.app/Contents/Resources/claude-shim/`. Limpid prepends
      # this directory to `PATH` for every pty it spawns so `claude`
      # invocations are intercepted.
      - path: Limpid/Resources/claude-shim
        type: folder
      # Bundle the Codex shim + hook receiver, on the same terms: this
      # directory is prepended to `PATH` too, so `codex` invocations are
      # intercepted the way `claude` ones are.
      - path: Limpid/Resources/codex-shim
        type: folder
      # Shared POSIX helpers sourced by both agent integrations. Kept as a
      # folder resource so the relative path from each hook stays stable.
      - path: Limpid/Resources/agent-shim
        type: folder
      # Ship the license + third-party attribution inside the app bundle so
      # the MIT / GPL notices travel with the distributed .app, satisfying the
      # "include the copyright notice in all copies" requirement — not just
      # in the source repo.
      - path: THIRD-PARTY-NOTICES
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    # Explicit Info.plist (not the GENERATE_INFOPLIST_FILE auto-version)
    # because Sparkle's `SU*` keys aren't on Xcode's INFOPLIST_KEY_*
    # allow-list. XcodeGen fills in the standard CFBundle keys for us.
    info:
      path: Limpid/Resources/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: YES
        # Resolves to "Limpid" in Release and "Limpid Dev" in Debug
        # via the per-config PRODUCT_NAME override below.
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        # Resolves to AppIcon (Release, turquoise) or AppIcon-Dev
        # (Debug, purple) via ASSETCATALOG_COMPILER_APPICON_NAME so
        # the two builds are also distinct on the Dock.
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        # Surfaces under "About Limpid" / Finder / Spotlight / Sparkle's
        # update dialog. Localize via InfoPlist.xcstrings for ja.
        NSHumanReadableCopyright: "© 2026 nek0der. MIT License."
        LSApplicationCategoryType: public.app-category.developer-tools
        # `NO` for both: with sudden / automatic termination enabled
        # macOS can `_exit` the process without firing the
        # `applicationWillTerminate` notification. We rely on that
        # notification to dump scrollback and persist state, so the
        # flags must stay off. (Sparkle / Apple's defaults both
        # suggest these, but they assume an app with no save-on-quit
        # work — which Limpid clearly isn't.)
        NSSupportsAutomaticTermination: NO
        NSSupportsSuddenTermination: NO
        # Reference the MARKETING_VERSION / CURRENT_PROJECT_VERSION
        # build settings (set in the base settings, overridden by CI)
        # so a single source of truth flows into the bundle.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        # Usage descriptions for filesystem locations the embedded shell
        # is likely to touch. macOS shows these strings in the consent
        # prompt; keep them honest and short. Music / Photos are
        # intentionally omitted — a terminal shouldn't be asking.
        NSDocumentsFolderUsageDescription: "Limpid runs a shell that may access files under your Documents folder."
        NSDownloadsFolderUsageDescription: "Limpid runs a shell that may access files under your Downloads folder."
        NSDesktopFolderUsageDescription: "Limpid runs a shell that may access files on your Desktop."
        NSRemovableVolumesUsageDescription: "Limpid runs a shell that may access removable volumes."
        NSNetworkVolumesUsageDescription: "Limpid runs a shell that may access network volumes."
        # Paired with the entitlements below. The entitlement lets the
        # request reach TCC at all; these strings are what TCC shows when
        # it asks. A command run in a pane is attributed to us, so the
        # prompt names Limpid rather than the tool the user typed.
        NSMicrophoneUsageDescription: "Limpid runs a shell that may record audio, such as a voice-input tool."
        NSAppleEventsUsageDescription: "Limpid runs a shell that may control other apps with AppleScript."
        # Sparkle update settings (https://sparkle-project.org/documentation/)
        # SUFeedURL points to the appcast hosted on GitHub Pages.
        # SUPublicEDKey is the EdDSA public key paired with the private key
        # held in Keychain (and backed up offline). Lose the private key
        # and existing users can never auto-update again — never lose it.
        SUFeedURL: "https://nek0der.github.io/limpid/appcast.xml"
        SUPublicEDKey: "TaNB85h5yh8v6GIs4veFHhdkUYlL35jXJbl/NpjhxNs="
        SUEnableAutomaticChecks: YES
        SUScheduledCheckInterval: 86400
        # Refuse to extract the downloaded update if the EdDSA signature
        # doesn't verify. Without this the bytes are extracted first and
        # only then checked, which widens the attack surface (path-traversal
        # in a zip / dmg engine bug). Sparkle 2.7.3+.
        SUVerifyUpdateBeforeExtraction: YES
    # Hardened Runtime denies every TCC-protected resource unless the
    # binary carries the matching entitlement, and the denial happens
    # before macOS can show a consent prompt — the user sees a tool that
    # silently does nothing. Commands in a pane run under our
    # responsible process, so these cover what people run in the
    # terminal (`sox rec`, a transcription CLI, `osascript`) rather than
    # anything the app does itself. Add to this list only with a
    # concrete command in mind; each entry widens what a compromised
    # shell could ask for.
    entitlements:
      path: Limpid/Resources/Limpid.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.Limpid
        PRODUCT_NAME: Limpid
        # Keep the Swift module name stable across configurations so
        # `@testable import Limpid` keeps working even in Debug where
        # the product name is "Limpid Dev". Without this, the module
        # name auto-tracks PRODUCT_NAME → "Limpid_Dev" and the test
        # target fails to link.
        PRODUCT_MODULE_NAME: Limpid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Cargo reads its rustup-managed toolchain outside the repository, which
        # cannot be expressed as stable Xcode build-script inputs. Keep the
        # exception scoped to the target that owns the Rust build phase.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(PROJECT_DIR)/vendor/ghostty/macos
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(DERIVED_FILE_DIR)/limpid-rust
        OTHER_LDFLAGS:
          - $(inherited)
          - -llimpid_rust_bridge
      configs:
        # Debug builds get a distinct bundle id + display name so the
        # daily-driver dmg (`dev.limpid.Limpid` / "Limpid") and the
        # in-progress Xcode build can coexist on the same Mac. They
        # also branch on this id at runtime to pick a separate
        # Application Support directory ("Limpid Dev/") — see
        # `LimpidPaths.applicationSupportDirectoryName`.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.Limpid.dev
          PRODUCT_NAME: "Limpid Dev"
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
          EXCLUDED_SOURCE_FILE_NAMES: dev.limpid.agent-integration-service.plist
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: dev.limpid.agent-integration-service.dev.plist
    dependencies:
      - target: AgentIntegrationService
        embed: true
        link: false
        copy:
          destination: executables
      - target: AgentIntegrationHookHelper
        embed: true
        link: false
        copy:
          destination: executables
      - framework: vendor/ghostty/macos/GhosttyKit.xcframework
        embed: false
      - package: Sparkle
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
    preBuildScripts:
      - name: Build Rust bridge
        script: '"$SRCROOT/scripts/build-rust-bridge.sh"'
        # Cargo owns the complete Rust dependency graph. Invoke it on every
        # Xcode build so adding a module cannot leave a stale static library;
        # Cargo's incremental check keeps unchanged builds fast.
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Cargo.toml
          - $(SRCROOT)/Cargo.lock
          - $(SRCROOT)/rust-toolchain.toml
          - $(SRCROOT)/scripts/build-rust-bridge.sh
          - $(SRCROOT)/rust/limpid-rust-bridge/Cargo.toml
          - $(SRCROOT)/rust/limpid-rust-bridge/src/lib.rs
        outputFiles:
          - $(DERIVED_FILE_DIR)/limpid-rust/liblimpid_rust_bridge.a

  LimpidTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LimpidTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.limpid.LimpidTests
        PRODUCT_NAME: LimpidTests
        BUNDLE_LOADER: $(TEST_HOST)
        # Debug builds rename the product to "Limpid Dev.app" (see the
        # Debug override on the Limpid target). The test host must
        # match — without the per-config split the test bundle would
        # try to link against `Limpid.app` and fail in Debug.
      configs:
        Debug:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/Limpid Dev.app/Contents/MacOS/Limpid Dev
        Release:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/Limpid.app/Contents/MacOS/Limpid
    dependencies:
      - target: Limpid

# Explicit scheme so `xcodebuild -scheme Limpid test` knows about the
# LimpidTests target. Without this xcodegen's autogenerated scheme can
# drop the test action on some xcodegen versions.
schemes:
  Limpid:
    build:
      targets:
        Limpid: all
        LimpidTests: [test]
    test:
      targets:
        - LimpidTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  AgentIntegrationProbes:
    build:
      targets:
        AgentIntegrationRequesterProbe: all
        AgentIntegrationControllerProbe: all
    run:
      config: Debug
